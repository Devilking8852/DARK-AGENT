name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node tests (core logic)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run core tests
        run: node tests/app.test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dark-agent-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dark-agent-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **DARK AGENT** — APK build for `${{ github.ref_name }}`.

            MADE BY - @TEAMDARK_OWNER

            Install: download the APK, allow "install unknown apps", open it,
            then add your API key in Settings.
